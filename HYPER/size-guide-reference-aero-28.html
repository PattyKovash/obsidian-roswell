<!--
  REFERENCE ONLY — not synced to Shopify, not committed to the theme.

  Hypothetical Tier 1 example for Aero 28 (attributes only, no markup — see
  assets/size-guide-widget.js header). Demonstrates a genuinely different `sizes` shape from Junction's,
  sourced from real product data rather than guessed:

  - Aero 28's actual "Torso Length" variant option (confirmed live on
    https://hyperlitemountaingear.com/products/aero-28) has exactly 3 values: Small, Medium, Large — no
    Extra Small, no Tall.
  - The 15"-17" / 17"-19" / 19"-21" boundaries aren't invented for this example — they're the same ranges
    already hardcoded in snippets/product-form.liquid:275-284, the theme's existing generic swatch-label
    logic for any "Torso Length" option (independent of anything built for ISSUE-024). Aero 28 just uses 3
    of that convention's 5 possible tiers; Junction's default table (in size-guide-widget.js) uses all 5.

  This is a 3-tier table, unlike Junction's 5-tier default — proves _renderSizeBar() actually builds a
  matching bar/ticks from whatever shape is passed, not just a re-skinned version of the default 5.

  Note: this is NOT the same thing as the OLD, separate aero-28-specific hardcoded calculator in
  sections/main-product.liquid (~L283-414) — that one takes torso AND chest as a 2D lookup and produces
  S/M/L from a different formula entirely. This example is markup for the NEW accentuate.content-driven
  <hmg-size-widget>, unrelated to that legacy code path.
-->

<hmg-size-widget
  class="hmg-sizer-std"
  sizes='[
    {"key":"s","label":"Small","short":"S","minIn":0,"maxIn":17,"desc":"Small torso (15\"-17\"). Best fit for shorter frames on the Aero 28."},
    {"key":"m","label":"Medium","short":"M","minIn":17,"maxIn":19,"desc":"Medium torso (17\"-19\"). The most common fit for the Aero 28."},
    {"key":"l","label":"Large","short":"L","minIn":19,"maxIn":99,"desc":"Large torso (19\"-21\"+). Best fit for longer frames on the Aero 28."}
  ]'
  video-url="https://hyperlitemountaingear.com/pages/hiking-backpack-size-chart"
  measurement-image="https://cdn.shopify.com/s/files/1/3004/4846/files/sizechart2_34799d12-82b4-4623-9510-0cb06f864486.png?v=1784311305"
></hmg-size-widget>
